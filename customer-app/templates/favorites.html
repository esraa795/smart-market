<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Wishlist</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      margin:0;
      background: linear-gradient(180deg, #eef2ff 0%, #f7f8fc 100%);
      color:#111827;
    }

    .page{
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 22px 40px;
    }

    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom: 18px;
    }

    .title{
      display:flex;
      align-items:center;
      gap:12px;
      font-size: 42px;
      font-weight: 900;
      margin:0;
    }

    .title img{
      width:44px;
      height:44px;
      object-fit:contain;
    }

    .back-btn{
      display:flex;
      align-items:center;
      gap:10px;
      background:#ffffff;
      border:1px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 10px 14px;
      cursor:pointer;
      font-weight: 900;
      box-shadow: 0 12px 30px rgba(0,0,0,0.10);
      user-select:none;
    }
    .back-btn img{
      width:26px;
      height:26px;
      object-fit:contain;
    }

    .card{
      background:#fff;
      border-radius:20px;
      box-shadow:0 18px 45px rgba(0,0,0,0.10);
      border:1px solid rgba(0,0,0,0.06);
      overflow:hidden;
    }

    .table-head{
      display:grid;
      grid-template-columns: 2.2fr 0.8fr 1.2fr;
      gap:12px;
      padding: 16px 18px;
      background:#ffffff;
      border-bottom:1px solid #e5e7eb;
      font-weight:900;
      color:#1f2a66;
    }

    /* הפריטים שה-JS מזריק */
    #favorites .fav-item{
      display:grid;
      grid-template-columns: 2.2fr 0.8fr 1.2fr;
      gap:12px;
      padding: 16px 18px;
      border-bottom:1px solid #e5e7eb;
      align-items:center;
      background:#fff;
    }

    #favorites .fav-item:last-child{
      border-bottom:none;
    }

    /* צד מוצר */
    #favorites .fav-item .product{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }

    /* תמונה לא נחתכת */
    #favorites .fav-item img{
      width:90px !important;
      height:90px !important;
      object-fit: contain !important;
      background:#f8fafc;
      border:1px solid rgba(0,0,0,0.08);
      border-radius:14px;
      padding:8px;
      box-sizing:border-box;
      flex:0 0 auto;
    }

    .name{
      font-weight:900;
      font-size:16px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .price{
      font-weight:900;
      text-align:center;
      direction:ltr;
    }

    .actions{
      display:flex;
      gap:10px;
      justify-content:flex-end;
      flex-wrap:wrap;
    }

    button{
      border:none;
      padding:12px 14px;
      border-radius:12px;
      cursor:pointer;
      font-size:14px;
      font-weight:900;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      min-width: 140px;
    }

    .add-cart{
      background:#1f2a66;
      color:#fff;
    }

    .remove{
      background:#e11d48;
      color:#fff;
    }

    #empty{
      margin-top:14px;
      color:#6b7280;
      font-weight:800;
      text-align:center;
    }

    @media (max-width: 900px){
      .title{ font-size: 34px; }
      .title img{ width:38px; height:38px; }

      .table-head{ display:none; }
      #favorites .fav-item{
        grid-template-columns: 1fr;
      }
      .actions{ justify-content:flex-start; }
      button{ width:100%; min-width:unset; }
      .price{ text-align:left; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="header">
      <h1 class="title">
        <img src="/static/images/love.png" alt="love">
        My Wishlist
      </h1>

      <button class="back-btn" id="backBtn" type="button">
        <img src="/static/images/left-arrow.png" alt="back">
        Back to Home
      </button>
    </div>

    <div class="card">
      <div class="table-head">
        <div>Product</div>
        <div style="text-align:center;">Price</div>
        <div style="text-align:right;">Actions</div>
      </div>

      <!-- JS יכניס לפה את items -->
      <div id="favorites"></div>
    </div>

    <p id="empty"></p>
  </div>

  <script type="module" src="/static/favorites.js"></script>
  <script>
    document.getElementById("backBtn").onclick = () => {
      location.href = "/customer";
    };
  </script>
</body>
</html>
