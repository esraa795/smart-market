<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup | Smart Market</title>

  <style>
    /* ⬅️ כל ה-CSS נשאר בדיוק כמו ששלחת */
    *{
      box-sizing:border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: linear-gradient(180deg, #cfe9e4 0%, #f3d6d6 100%);
      padding: 40px 24px;
    }

    .card {
      width: 580px;
      padding: 36px 32px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.18);
      height: auto;
      max-height: fit-content;
    }

    h2{
      margin:0 0 16px;
      font-weight:800;
      color:#7fbdb3;
    }

    .logo{
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo img{
      width: 300px;
      height: auto;
    }

    .form{
      text-align:left;
    }

    .row{
      display:flex;
      gap:12px;
      margin-bottom:14px;
    }

    .field{
      flex:1;
    }

    .field input{
      width:100%;
      padding:13px 14px;
      border-radius:14px;
      border:1px solid #e0e0e0;
      background:#fafafa;
      font-size:14px;
      outline:none;
    }

    .field input:focus{
      border-color:#7fbdb3;
      background:white;
      box-shadow:0 0 0 4px rgba(127,189,179,0.22);
    }

    .btn-primary{
      width:100%;
      margin-top:18px;
      padding:14px;
      border:none;
      border-radius:18px;
      background:#7fbdb3;
      color:white;
      font-weight:800;
      font-size:15px;
      cursor:pointer;
      letter-spacing:.5px;
      transition:.2s;
    }

    .btn-primary:hover{
      filter:brightness(.95);
    }

    .divider{
      text-align:center;
      margin:18px 0 10px;
      font-size:12px;
      color:#999;
    }

    .btn-outline{
      display:inline-block;
      padding:8px 18px;
      border-radius:14px;
      border:1px solid #7fbdb3;
      color:#7fbdb3;
      font-size:13px;
      font-weight:500;
      text-decoration:none;
      transition:.2s;
    }

    .btn-outline:hover{
      background:#7fbdb3;
      color:white;
    }

    @media(max-width:420px){
      .card{
        width:90%;
      }
      .row{
        flex-direction:column;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      <img src="{{ url_for('static', filename='images/smartshop.png') }}" alt="Smart Market">
    </div>

    <h2>Sign Up</h2>

    <!-- FORM -->
    <form class="form" onsubmit="signup(); return false;">

      <div class="row">
        <div class="field">
          <input type="text" id="firstName" placeholder="First Name">
        </div>
        <div class="field">
          <input type="text" id="lastName" placeholder="Last Name">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <input type="email" id="email" placeholder="Email">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <input type="password" id="password" placeholder="Password">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <input type="tel" id="phone" placeholder="Phone Number">
        </div>
        <div class="field">
          <input type="text" id="address" placeholder="Address">
        </div>
      </div>

      <button class="btn-primary" type="submit">Sign Up</button>

    </form>

    <div class="divider">Already have an account?</div>

    <div style="text-align:center;">
      <a href="/login" class="btn-outline">Login</a>
    </div>

  </div>

  <!-- JS -->
  <script type="module" src="{{ url_for('static', filename='auth.js') }}"></script>

</body>
</html>
