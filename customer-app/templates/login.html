<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Smart Market</title>

  <style>
    /* ⬅️ כל ה-CSS נשאר בדיוק כמו ששלחת */
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(180deg, #cfe9e4 0%, #f3d6d6 100%);
      padding:24px;
    }

    .wrap{
      width:min(980px,100%);
      display:grid;
      grid-template-columns:1fr 1fr;
      border-radius:26px;
      overflow:hidden;
      box-shadow:0 25px 55px rgba(0,0,0,0.12);
      background:white;
    }

    .left{
      background:url("{{ url_for('static', filename='images/login-photo.jpg') }}") center/cover no-repeat;
      min-height:520px;
    }

    .right{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px 38px;
    }

    .card{
      width:100%;
      max-width:360px;
    }

    .title{
      text-align:center;
      font-size:26px;
      margin-bottom:6px;
      font-weight:800;
    }

    .subtitle{
      text-align:center;
      margin-bottom:28px;
      color:#8a8a8a;
      font-size:13px;
    }

    .field{
      position:relative;
      margin-bottom:18px;
    }

    .field input{
      width:100%;
      padding:13px 46px;
      border-radius:14px;
      border:1px solid #e6e6e6;
      background:#fbfbfb;
      font-size:14px;
      outline:none;
      transition:.2s;
    }

    .field input:focus{
      border-color:#9fd2c8;
      box-shadow:0 0 0 4px rgba(159,210,200,0.22);
      background:white;
    }

    .left-icon{
      position:absolute;
      left:16px;
      top:40%;
      transform:translateY(-50%);
      width:24px;
      opacity:.6;
      pointer-events:none;
    }

    .right-icon{
      position:absolute;
      right:16px;
      top:40%;
      transform:translateY(-50%);
      width:24px;
      cursor:pointer;
      opacity:.6;
    }

    .right-icon:hover{
      opacity:1;
    }

    .error{
      font-size:12px;
      color:#e05252;
      margin-top:6px;
      min-height:14px;
    }

    .btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:16px;
      background:#7fbdb3;
      color:white;
      font-weight:800;
      cursor:pointer;
      margin-top:10px;
    }

    .row{
      display:flex;
      justify-content:center;
      gap:10px;
      margin-top:14px;
      font-size:12px;
      color:#8a8a8a;
    }

    .row a{
      color:#6aaea3;
      text-decoration:none;
      font-weight:700;
    }

    @media (max-width:820px){
      .wrap{grid-template-columns:1fr;}
      .left{min-height:260px;}
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="left"></div>

    <div class="right">
      <div class="card">

        <h1 class="title">WELCOME BACK</h1>
        <p class="subtitle">Your Smart Market journey awaits.</p>

        <!-- FORM -->
        <form onsubmit="login(); return false;">

          <div class="field">
            <img src="{{ url_for('static', filename='images/email-icon.jpg') }}" class="left-icon">
            <input type="email" id="email" placeholder="Email Address">
            <div class="error" id="emailError"></div>
          </div>

          <div class="field">
            <img src="{{ url_for('static', filename='images/lock-icon.jpg') }}" class="left-icon">
            <input type="password" id="password" placeholder="Password">
            <img src="{{ url_for('static', filename='images/eye-icon.jpg') }}" class="right-icon" onclick="togglePassword()">
            <div class="error" id="passwordError"></div>
          </div>

          <button class="btn" type="submit">LOG IN</button>

        </form>

        <div class="row">
          <a href="#" onclick="forgotPassword(); return false;">Forgot password?</a>
          <span>·</span>
          <span>Don’t have an account?</span>
          <a href="{{ url_for('signup') }}">Sign up</a>
        </div>

      </div>
    </div>
  </div>

  <!-- JS -->
  <script type="module" src="{{ url_for('static', filename='auth.js') }}"></script>

  <script>
    function togglePassword(){
      const input = document.getElementById("password");
      input.type = input.type === "password" ? "text" : "password";
    }
  </script>

</body>
</html>
