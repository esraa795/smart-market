<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ query }} – Products</title>

  <style>
    :root{
      --bg1:#cfe9e4;
      --bg2:#f3d6d6;
      --card: rgba(255,255,255,0.70);
      --stroke: rgba(0,0,0,0.08);
      --text:#0f172a;
      --muted:#64748b;
      --shadow: 0 22px 60px rgba(0,0,0,0.14);
      --focus: 0 0 0 4px rgba(127,189,179,0.24);
      --radius: 22px;
    }

    *{ box-sizing:border-box; font-family: Arial, sans-serif; }

    body{
      margin:0;
      color:var(--text);
      min-height:100vh;
      padding:28px 18px;
      background:
        radial-gradient(900px 520px at 20% 10%, rgba(127,189,179,0.35), transparent 60%),
        radial-gradient(900px 520px at 80% 18%, rgba(246,182,200,0.35), transparent 60%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    }

    .wrap{
      max-width:1200px;
      margin:0 auto;
    }

    /* top bar */
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }

    .title{
      margin:0;
      font-size:34px;
      font-weight:900;
      letter-spacing:.2px;
    }

    .subtitle{
      margin:4px 0 0;
      color:var(--muted);
      font-weight:800;
    }

    .back-btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:999px;
      background: rgba(255,255,255,0.55);
      border:1px solid var(--stroke);
      box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor:pointer;
      text-decoration:none;
      color:var(--text);
      font-weight:900;
      transition: transform .15s ease, filter .15s ease;
    }
    .back-btn:hover{ transform: translateY(-1px); filter: brightness(1.03); }

    .back-btn img{
      width:22px;
      height:22px;
      object-fit:contain;
      display:block;
    }

    /* card container */
    .panel{
      background: var(--card);
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding:18px;
      overflow:hidden;
      position:relative;
    }

    .panel::before{
      content:"";
      position:absolute;
      inset:-2px;
      background: linear-gradient(135deg, rgba(127,189,179,0.18), rgba(246,182,200,0.14), transparent 70%);
      opacity:.6;
      pointer-events:none;
    }

    /* grid */
    #results{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap:18px;
      list-style:none;
      padding:0;
      margin:0;
    }

    .product-card{
      background: rgba(255,255,255,0.75);
      border:1px solid rgba(0,0,0,0.08);
      border-radius:18px;
      padding:16px 14px;
      text-align:left;
      box-shadow: 0 10px 24px rgba(0,0,0,0.10);
      cursor:pointer;
      transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height: 250px;
    }

    .product-card:hover{
      transform: translateY(-2px);
      filter: brightness(1.02);
      box-shadow: 0 18px 36px rgba(0,0,0,0.14);
    }

    .imgbox{
      width:100%;
      height:160px;
      border-radius:16px;
      background: rgba(255,255,255,0.9);
      border:1px solid rgba(0,0,0,0.06);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .product-card img{
      width:100%;
      height:100%;
      object-fit:contain;
      padding:10px;
    }

    .name{
      margin:0;
      font-weight:900;
      font-size:16px;
      line-height:1.2;
      min-height:38px;
    }

    .price{
      margin:0;
      font-weight:900;
      font-size:16px;
      color:#0f172a;
    }

    .chip{
      align-self:flex-start;
      font-size:12px;
      font-weight:900;
      color:#0f172a;
      background: rgba(127,189,179,0.22);
      border:1px solid rgba(127,189,179,0.35);
      padding:6px 10px;
      border-radius:999px;
    }

    .empty{
      position:relative;
      z-index:1;
      margin:0;
      font-weight:900;
      color:var(--muted);
      padding:10px 2px;
    }

    @media (max-width:420px){
      .title{ font-size:26px; }
      .panel{ padding:14px; }
      #results{ grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
      .imgbox{ height:140px; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="top">
      <div>
        <h1 class="title">Products: <span style="color:#1f2a66;">{{ query }}</span></h1>
        <p class="subtitle">Browse items in this category</p>
      </div>

      <!-- ✅ Back button to CUSTOMER -->
      <a class="back-btn" href="/customer">
        <img src="/static/images/left-arrow.png" alt="Back">
        Back
      </a>
    </div>

    <div class="panel">
      <ul id="results">Loading products...</ul>
    </div>

  </div>

  <script type="module">
    import { db } from "/static/firebase.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    const category = "{{ query }}";

    async function loadResults() {
      const ul = document.getElementById("results");
      ul.innerHTML = "";

      const snapshot = await getDocs(
        collection(db, "products", category, "items")
      );

      if (snapshot.empty) {
        ul.innerHTML = `<p class="empty">No products found.</p>`;
        return;
      }

      snapshot.forEach(doc => {
        const item = doc.data();

        const li = document.createElement("li");
        li.className = "product-card";

        li.innerHTML = `
          <div class="chip">${category}</div>
          <div class="imgbox">
            <img src="${item.imageUrl || ""}" alt="${item.Name || ""}">
          </div>
          <p class="name">${item.Name || ""}</p>
          <p class="price">₪${item.price ?? ""}</p>
        `;

        li.addEventListener("click", () => {
          window.location.href =
            `/product?category=${encodeURIComponent(category)}&item_id=${doc.id}`;
        });

        ul.appendChild(li);
      });
    }

    loadResults();
  </script>
</body>
</html>
