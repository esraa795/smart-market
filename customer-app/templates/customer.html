<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Market</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #cfe9e4 0%, #f3d6d6 100%);
    }

    /* ================= HEADER ================= */
    .top-bar {
      display: flex;
      align-items: center;
      padding: 12px 24px;
      background: #776672;
    }

    .logo img {
      height: 110px;
    }

    .search-wrapper {
      width: 900px;
      margin-left: 24px;
      padding: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff6ec4, #7873f5, #1b9b8e);
    }

    .search-inner {
      background: #fff;
      border-radius: 999px;
      display: flex;
      align-items: center;
      padding: 12px 20px;
    }

    .search-inner input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .search-inner button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }

    .spacer { flex: 1; }

    .icons {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    /* ✅ חדש: כדי שלא יהיה רקע לבן לקישור של האייקון */
    .icon-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      padding: 0;
      margin: 0;
      border: none;
      outline: none;
      text-decoration: none;
    }

    /* ✅ חדש: מוריד כל רקע לבן מהתמונה עצמה */
    .icon-img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      background: transparent !important;
      display: block;
    }

    /* ================= CATEGORIES ================= */
    .category-wrapper {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .category-header {
      background: white;
      padding: 14px 18px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .arrow {
      transition: transform 0.3s ease;
    }

    .arrow.rotate {
      transform: rotate(90deg);
    }

    /* GRID */
    .category-grid {
      margin-top: 20px;
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .category-grid.open {
      display: grid;
    }

    /* CARD */
    .category-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
    }

    /* 🔥 תמונות אחידות */
    .category-card img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
    }

    /* 🔥 שם קטגוריה יציב, בלי נקודות, בלי קפיצות */
    .category-card span {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      margin-top: 6px;
      font-weight: 700;
      font-size: 14px;
      color: #222;
      text-align: center;
      line-height: 1.2;
      white-space: normal;
      list-style: none;
    }

    /* ================= HERO ================= */
    .hero-slider {
      width: 80vw;
      max-width: 1600px;
      height: 260px;
      margin: 30px auto;
      overflow: hidden;
      border-radius: 18px;
    }

    .hero-slider img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .hero-slider img.active {
      display: block;
    }

    /* ================= CONTACT BAR (NEW) ================= */
    .contact-bar {
      background: #f3d6d6;
      padding: 28px 20px;
      margin: 40px 0 0;
    }

    .contact-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .contact-text h2 {
      margin: 0;
      font-size: 22px;
      color: #1f2a66;
    }

    .contact-text p {
      margin: 6px 0 0;
      color: #555;
      font-size: 14px;
    }

    .contact-form {
      flex: 1;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .contact-form input {
      flex: 1;
      min-width: 180px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #fcb3f9;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    .contact-form input:focus {
      border-color: #7873f5;
    }

    /* ✅ SELECT עיצוב יפה (מחוץ ל־media כדי שיעבוד גם בדסקטופ) */
    .contact-form select {
      flex: 1;
      min-width: 180px;
      padding: 12px 44px 12px 14px;
      border-radius: 10px;
      border: 1px solid #fcb3f9;
      font-size: 14px;
      font-weight: 700;
      outline: none;
      background: #fff;
      cursor: pointer;

      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;

      background-image:
        linear-gradient(45deg, transparent 50%, #555 50%),
        linear-gradient(135deg, #555 50%, transparent 50%);
      background-position:
        calc(100% - 18px) 50%,
        calc(100% - 12px) 50%;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
    }

    .contact-form select:focus {
      border-color: #7873f5;
      box-shadow: 0 0 0 3px rgba(120,115,245,0.15);
    }

    .contact-form button {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background: #1f2a66;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      min-width: 130px;
    }

    .contact-form button:hover {
      opacity: 0.9;
    }

    @media (max-width: 768px) {
      .contact-inner {
        flex-direction: column;
        align-items: stretch;
      }

      .contact-form {
        flex-direction: column;
      }

      .contact-form input,
      .contact-form select,
      .contact-form button {
        min-width: 100%;
      }
    }
  </style>
</head>

<body>

  <header class="top-bar">
    <div class="logo">
      <img src="{{ url_for('static', filename='images/smartshop.png') }}">
    </div>

    <form class="search-wrapper" action="/search" method="GET">
      <div class="search-inner">
        <input type="text" name="q" placeholder="Search for products..." required>
        <button>🔍</button>
      </div>
    </form>

    <div class="spacer"></div>

    <div class="icons">
      <a href="/login" class="icon-link">
        <img src="{{ url_for('static', filename='images/woman.png') }}" class="icon-img">
      </a>

      <a href="/favorites" class="icon-link">
        <img src="{{ url_for('static', filename='images/favourite2.png') }}" class="icon-img">
      </a>

      <a href="/cart" class="icon-link">
        <img src="{{ url_for('static', filename='images/grocery-cart.png') }}" class="icon-img">
      </a>

      <a href="/my-orders" class="icon-link">
        <img src="{{ url_for('static', filename='images/box.png') }}" class="icon-img">
      </a>

      <a href="/notifications" class="icon-link" style="position:relative; display:inline-block;">
        <img src="{{ url_for('static', filename='images/alarm.png') }}" class="icon-img">
        <span id="notifBadge" style="
          position:absolute;
          top:-6px;
          right:-6px;
          width:14px;
          height:14px;
          background:red;
          border-radius:50%;
          border:2px solid white;
          display:none;
        "></span>
      </a>
    </div>
  </header>

  <!-- ================= CATEGORIES ================= -->
  <div class="category-wrapper">
    <div class="category-header" id="categoryToggle">
      categoryList
      <span class="arrow" id="categoryArrow">›</span>
    </div>

    <div class="category-grid" id="categoryList">
      <!-- נטען דינמית מ-Firebase -->
    </div>
  </div>

  <!-- ================= HERO ================= -->
  <div class="hero-slider">
    <img src="{{ url_for('static', filename='images/d11.png') }}" class="active">
    <img src="{{ url_for('static', filename='images/d13.png') }}">
    <img src="{{ url_for('static', filename='images/d4.png') }}">
  </div>

  <!-- ================= CONTACT BAR (NEW) ================= -->
  <section class="contact-bar">
    <div class="contact-inner">
      <div class="contact-text">
        <h2>📞 Contact Us</h2>
        <p>Leave your details and we’ll get back to you soon.</p>
      </div>

      <form class="contact-form" id="contactForm">
        <input type="text" name="phone" placeholder="📱 phoneNumber" required>
        <input type="text" name="fullName" placeholder="👤 Name" required>

        <input type="email" name="email" placeholder="✉️ Email" required>

        <select name="reason" id="reason" required>
          <option value="" disabled selected>Select reason...</option>
          <option value="Late delivery">Late delivery</option>
          <option value="Missing item">Missing item</option>
          <option value="Damaged product">Damaged product</option>
          <option value="Bad service">Bad service</option>
          <option value="Payment issue">Payment issue</option>
        </select>

        <button type="submit">Send</button>
      </form>
    </div>
  </section>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let current = 0;
      const slides = document.querySelectorAll(".hero-slider img");

      setInterval(() => {
        slides[current].classList.remove("active");
        current = (current + 1) % slides.length;
        slides[current].classList.add("active");
      }, 4000);
    });
  </script>

  <script type="module" src="{{ url_for('static', filename='categories.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='contact.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='notifications_badge.js') }}"></script>

</body>
</html>
