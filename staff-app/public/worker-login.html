<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Worker Login</title>

  <style>
    :root{
      --bg1:#cfe9e4;
      --bg2:#f3d6d6;
      --card: rgba(255,255,255,0.65);
      --stroke: rgba(0,0,0,0.08);
      --text:#0f172a;
      --muted:#64748b;
      --brand:#1f2a66;
      --shadow: 0 22px 60px rgba(0,0,0,0.14);
    }

    *{
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:48px 18px;
      background:
        radial-gradient(900px 520px at 20% 15%, rgba(127,189,179,0.35), transparent 60%),
        radial-gradient(900px 520px at 80% 20%, rgba(246,182,200,0.35), transparent 60%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      color:var(--text);
    }

    .card{
      width:min(520px, 94vw);
      padding:34px 32px;
      border-radius:22px;
      background: var(--card);
      border:1px solid var(--stroke);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position:relative;
      overflow:hidden;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-2px;
      background: linear-gradient(135deg, rgba(127,189,179,0.22), rgba(246,182,200,0.18), transparent 70%);
      opacity:.55;
      pointer-events:none;
    }

    h1{
      margin:0 0 18px;
      font-size:28px;
      font-weight:900;
      letter-spacing:.2px;
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      gap:10px;
    }

    form{
      position:relative;
      z-index:1;
    }

    input{
      width:100%;
      padding:14px 16px;
      border:1px solid rgba(0,0,0,0.10);
      border-radius:14px;
      margin:10px 0;
      font-size:15px;
      background: rgba(250,250,250,0.9);
      outline:none;
      transition: box-shadow .18s ease, border-color .18s ease, background .18s ease;
    }

    input:focus{
      border-color: rgba(127,189,179,0.85);
      background:#fff;
      box-shadow: 0 0 0 4px rgba(127,189,179,0.25);
    }

    button{
      width:100%;
      padding:14px 16px;
      border:none;
      border-radius:14px;
      background: var(--brand);
      color:#fff;
      font-weight:900;
      cursor:pointer;
      font-size:15px;
      letter-spacing:.4px;
      margin-top:10px;
      box-shadow: 0 14px 28px rgba(31,42,102,0.22);
      transition: transform .15s ease, filter .15s ease;
    }

    button:hover{
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .msg{
      margin-top:12px;
      color:#c00;
      font-weight:800;
      min-height:18px;
      position:relative;
      z-index:1;
    }

    @media (max-width:420px){
      .card{padding:28px 20px}
      h1{font-size:24px}
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>👷 Worker Login</h1>

    <form id="workerLoginForm">
      <input id="email" type="email" placeholder="Email" required />
      <input id="password" type="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <div id="msg" class="msg"></div>
  </div>

  <script type="module" src="./worker-login.js"></script>
</body>
</html>
