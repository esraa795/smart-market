<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>

  <style>
    :root{
      --bg1:#0b1022;
      --bg2:#1b0f2b;
      --card: rgba(255,255,255,0.08);
      --stroke: rgba(255,255,255,0.14);
      --text: #e9eefc;
      --muted: rgba(233,238,252,0.75);
      --shadow: 0 18px 60px rgba(0,0,0,0.45);
      --glow: 0 0 0 4px rgba(153,102,255,0.12);
    }

    *{
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      margin:0;
      direction:rtl;
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 15% 10%, rgba(153,102,255,0.25), transparent 55%),
        radial-gradient(1000px 500px at 85% 30%, rgba(0,209,255,0.18), transparent 55%),
        linear-gradient(135deg, var(--bg2), var(--bg1));
      padding:28px 18px;
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
    }

    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }

    h1{
      margin:0;
      font-size:34px;
      font-weight:900;
      letter-spacing:.2px;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      border-radius:999px;
      background: rgba(255,255,255,0.08);
      border:1px solid var(--stroke);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--glow);
      color: var(--muted);
      font-weight:800;
      font-size:13px;
      white-space:nowrap;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap:16px;
    }

    .card{
      background: var(--card);
      border:1px solid var(--stroke);
      border-radius:22px;
      padding:18px 18px;
      box-shadow: var(--shadow);
      cursor:pointer;
      position:relative;
      overflow:hidden;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      min-height: 120px;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        linear-gradient(135deg, rgba(153,102,255,0.28), rgba(0,209,255,0.18), transparent 65%);
      opacity:.22;
      pointer-events:none;
    }

    .card:hover{
      transform: translateY(-3px);
      border-color: rgba(233,238,252,0.25);
      background: rgba(255,255,255,0.10);
    }

    .title{
      margin:0 0 8px;
      font-weight:900;
      font-size:18px;
      color: var(--text);
      position:relative;
      z-index:1;
    }

    .desc{
      margin:0;
      font-weight:800;
      color: var(--muted);
      position:relative;
      z-index:1;
      line-height:1.45;
      font-size:13.5px;
    }

    @media (max-width: 480px){
      h1{font-size:28px}
      .badge{display:none}
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="header">
      <h1>🛡️ לוח מנהל</h1>
      <div class="badge">גישה מנהל • Admin Panel</div>
    </div>

    <div class="grid">
      <div class="card" onclick="location.href='/admin-contacts.html'">
        <p class="title">📩 פניות לקוח</p>
        <p class="desc">צפייה בכל הפניות + סטטוס</p>
      </div>

      <div class="card" onclick="location.href='/admin-graphs.html'">
        <p class="title">📊 גרפים ודוחות</p>
        <p class="desc">מכירות, פניות נפוצות, השוואות ימים/חודשים</p>
      </div>

      <!-- נשאר אותו כפתור ליקוט, רק הטקסט תיאור השתנה -->
      <div class="card" onclick="location.href='/worker.html'">
        <p class="title">🛒 מערכת ליקוט</p>
        <p class="desc">כניסה למסך הליקוט</p>
      </div>

      <div class="card" onclick="location.href='/admin-products.html'">
        <p class="title">🧾 ניהול מוצרים</p>
        <p class="desc">הוספה / עדכון מחיר / מחיקה</p>
      </div>

      <!-- במקום "עוד כלי" -->
      <div class="card" onclick="location.href='/admin-workers.html'">
        <p class="title">👥 ניהול עובדים</p>
        <p class="desc">הוספת עובד חדש / מחיקה / עדכון תפקיד</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAdmin } from "./guard-admin.js";
    requireAdmin();
  </script>
</body>
</html>
