<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <title>פניות לקוח - מנהל</title>
  <style>
    body{font-family:Arial;direction:rtl;margin:0;background:#f6f7ff;color:#111827;padding:22px}
    .wrap{max-width:1200px;margin:0 auto}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    h1{margin:0;font-size:32px}
    a{color:#1f2a66;font-weight:900;text-decoration:none}

    .filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    select, input{
      padding:10px 12px;border-radius:12px;border:1px solid rgba(0,0,0,.12);
      font-weight:800;outline:none;background:#fff
    }

    table{
      width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;
      border:1px solid rgba(0,0,0,.08);box-shadow:0 10px 22px rgba(0,0,0,.08);margin-top:12px
    }
    th,td{padding:12px;border-bottom:1px solid rgba(0,0,0,.06);text-align:center;font-weight:800;vertical-align:top}
    th{background:#eef2ff;color:#1f2a66;font-weight:900}

    .pill{display:inline-block;padding:6px 10px;border-radius:999px;font-weight:900;font-size:12px}
    .new{background:#fee2e2;color:#991b1b}
    .handled{background:#dcfce7;color:#166534}

    .btn{
      padding:10px 12px;border-radius:12px;border:none;cursor:pointer;font-weight:900;
      background:#1f2a66;color:#fff
    }
    .btn:disabled{opacity:.5;cursor:not-allowed}

    .muted{color:#6b7280;font-weight:900;margin-top:10px}

    .noteBox{
      width: 100%;
      min-height: 64px;
      resize: vertical;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(0,0,0,.12);
      outline:none;
      font-weight:800;
      background:#fff;
      box-sizing:border-box;
    }

    .actionsCol{
      display:flex;
      flex-direction:column;
      gap:8px;
      align-items:stretch;
      justify-content:flex-start;
    }

    .btn-secondary{
      background:#555;color:#fff
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>📩 פניות לקוח</h1>
      <a href="/admin.html">⬅ חזרה ללוח מנהל</a>
    </div>

    <div class="filters">
      <select id="statusFilter">
        <option value="all">הכל</option>
        <option value="new">חדש</option>
        <option value="handled">טופל</option>
      </select>

      <input id="search" placeholder="חיפוש לפי טלפון/אימייל..." />
    </div>

    <table>
      <thead>
        <tr>
          <th>תאריך</th>
          <th>שם</th>
          <th>טלפון</th>
          <th>אימייל</th>
          <th>סיבה</th>
          <th>סטטוס</th>
          <th>הערת מנהל</th>
          <th>פעולה</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div id="empty" class="muted"></div>
  </div>

  <script type="module">
    import { requireAdmin } from "./guard-admin.js";
    requireAdmin();

    import { db } from "./firebase.js";
    import {
      collection, getDocs, query, orderBy,
      doc, updateDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    import { getAuth } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

    const tbody = document.getElementById("tbody");
    const empty = document.getElementById("empty");
    const statusFilter = document.getElementById("statusFilter");
    const search = document.getElementById("search");

    let all = [];

    function fmt(ts){
      if(!ts) return "";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return isNaN(d.getTime()) ? "" : d.toLocaleString();
    }

    function safe(v){ return (v===null||v===undefined) ? "" : String(v); }

    function render(){
      tbody.innerHTML = "";
      empty.textContent = "";

      const st = statusFilter.value;
      const q = search.value.trim().toLowerCase();

      const filtered = all.filter(x => {
        const okStatus = (st === "all") ? true : (x.status === st);
        const hay = `${x.phone} ${x.email} ${x.fullName}`.toLowerCase();
        const okSearch = q ? hay.includes(q) : true;
        return okStatus && okSearch;
      });

      if(filtered.length === 0){
        empty.textContent = "אין פניות להצגה לפי הסינון.";
        return;
      }

      filtered.forEach(r => {
        const tr = document.createElement("tr");

        const statusClass = r.status === "handled" ? "handled" : "new";
        const statusText = r.status === "handled" ? "טופל" : "חדש";

        tr.innerHTML = `
          <td>${fmt(r.createdAt)}</td>
          <td>${safe(r.fullName)}</td>
          <td>${safe(r.phone)}</td>
          <td>${safe(r.email)}</td>
          <td>${safe(r.reason)}</td>
          <td><span class="pill ${statusClass}">${statusText}</span></td>
          <td>
            <textarea class="noteBox" data-note-id="${r.id}" placeholder="כתוב כאן איך טופל / הערה...">${safe(r.adminNote)}</textarea>
          </td>
          <td>
            <div class="actionsCol">
              <button class="btn btn-secondary" data-save-id="${r.id}">
                שמור הערה
              </button>

              <button class="btn" ${r.status==="handled" ? "disabled" : ""} data-handle-id="${r.id}">
                סמן כטופל
              </button>
            </div>
          </td>
        `;

        tbody.appendChild(tr);
      });

      // שמירת הערה בלבד
      tbody.querySelectorAll("button[data-save-id]").forEach(btn => {
        btn.onclick = async () => {
          const id = btn.getAttribute("data-save-id");
          const ta = tbody.querySelector(`textarea[data-note-id="${id}"]`);
          const note = (ta?.value || "").trim();

          btn.disabled = true;

          try{
            const auth = getAuth();
            const uid = auth.currentUser?.uid || null;

            await updateDoc(doc(db, "contact_requests", id), {
              adminNote: note,
              noteUpdatedAt: serverTimestamp(),
              noteUpdatedBy: uid
            });

            const idx = all.findIndex(x => x.id === id);
            if(idx >= 0) all[idx].adminNote = note;

          }catch(e){
            alert("שגיאה בשמירת הערה");
          }finally{
            btn.disabled = false;
          }
        };
      });

      // סימון כטופל (וגם שומר הערה שיש בטקסטבוקס)
      tbody.querySelectorAll("button[data-handle-id]").forEach(btn => {
        btn.onclick = async () => {
          const id = btn.getAttribute("data-handle-id");
          const ta = tbody.querySelector(`textarea[data-note-id="${id}"]`);
          const note = (ta?.value || "").trim();

          btn.disabled = true;

          try{
            const auth = getAuth();
            const uid = auth.currentUser?.uid || null;

            await updateDoc(doc(db, "contact_requests", id), {
              status: "handled",
              handledAt: serverTimestamp(),
              adminNote: note,
              handledBy: uid
            });

            const idx = all.findIndex(x => x.id === id);
            if(idx >= 0) {
              all[idx].status = "handled";
              all[idx].adminNote = note;
            }

            render();
          }catch(e){
            alert("שגיאה בעדכון סטטוס");
            btn.disabled = false;
          }
        };
      });
    }

    async function load(){
      const q = query(collection(db, "contact_requests"), orderBy("createdAt","desc"));
      const snap = await getDocs(q);

      all = snap.docs.map(d => {
        const data = d.data() || {};
        return {
          id: d.id,
          fullName: data.fullName || "",
          phone: data.phone || "",
          email: data.email || "",
          reason: data.reason || "",
          status: data.status || "new",
          adminNote: data.adminNote || "",
          createdAt: data.createdAt || null
        };
      });

      render();
    }

    statusFilter.onchange = render;
    search.oninput = render;

    load();
  </script>
</body>
</html>
