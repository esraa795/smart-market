<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ניהול מוצרים - מנהל</title>

  <style>
    :root{
      --bg1:#cfe9e4;
      --bg2:#f3d6d6;

      --card: rgba(255,255,255,0.70);
      --stroke: rgba(17,24,39,0.10);

      --text:#0f172a;
      --muted:#64748b;
      --brand:#1f2a66;

      --shadow: 0 22px 60px rgba(0,0,0,0.14);
      --focus: 0 0 0 4px rgba(127,189,179,0.24);
      --radius: 22px;
    }

    *{ box-sizing:border-box; font-family:Arial, sans-serif; }

    body{
      direction:rtl;
      margin:0;
      color:var(--text);
      padding:26px 18px;
      min-height:100vh;
      background:
        radial-gradient(900px 520px at 20% 10%, rgba(127,189,179,0.35), transparent 60%),
        radial-gradient(900px 520px at 80% 18%, rgba(246,182,200,0.35), transparent 60%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    }

    .wrap{ max-width:1200px; margin:0 auto; }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    h1{
      margin:0;
      font-size:34px;
      font-weight:900;
      letter-spacing:.2px;
      display:flex;
      align-items:center;
      gap:10px;
    }

    a{
      color:var(--brand);
      font-weight:900;
      text-decoration:none;
      background: rgba(255,255,255,0.55);
      border:1px solid rgba(0,0,0,0.08);
      padding:10px 14px;
      border-radius:999px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform .15s ease, filter .15s ease;
    }
    a:hover{ transform: translateY(-1px); filter: brightness(1.03); }

    .grid{
      margin-top:10px;
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
    }

    .card{
      background: var(--card);
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:18px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      position:relative;
      overflow:hidden;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-2px;
      background: linear-gradient(135deg, rgba(127,189,179,0.18), rgba(246,182,200,0.14), transparent 70%);
      opacity:.6;
      pointer-events:none;
    }

    h2{
      margin:0 0 12px;
      color:var(--brand);
      font-size:22px;
      font-weight:900;
      position:relative;
      z-index:1;
    }

    label{
      display:block;
      margin:10px 0 6px;
      font-weight:900;
      color:var(--brand);
      position:relative;
      z-index:1;
    }

    input, select, textarea{
      width:100%;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.12);
      font-weight:800;
      outline:none;
      background: rgba(255,255,255,0.85);
      transition: box-shadow .18s ease, border-color .18s ease, background .18s ease;
      position:relative;
      z-index:1;
    }

    input:focus, select:focus, textarea:focus{
      border-color: rgba(127,189,179,0.90);
      background:#fff;
      box-shadow: var(--focus);
    }

    textarea{ min-height:110px; resize:vertical; }

    .row{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      position:relative;
      z-index:1;
    }
    @media(min-width:900px){
      .row{ grid-template-columns:repeat(3,1fr); }
    }

    .btns{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
      position:relative;
      z-index:1;
    }

    button{
      padding:12px 14px;
      border:none;
      border-radius:14px;
      cursor:pointer;
      font-weight:900;
      box-shadow: 0 14px 28px rgba(0,0,0,0.12);
      transition: transform .15s ease, filter .15s ease;
    }
    button:hover{ transform: translateY(-1px); filter: brightness(1.03); }

    .primary{ background: var(--brand); color:#fff; }
    .danger{ background:#b91c1c; color:#fff; }
    .secondary{ background:#475569; color:#fff; }

    .muted{
      color:var(--muted);
      font-weight:900;
      margin-top:10px;
      position:relative;
      z-index:1;
    }

    .list{
      margin-top:2px;
      border-top:1px solid rgba(0,0,0,.08);
      padding-top:16px;
    }

    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      overflow:hidden;
      border-radius:16px;
      border:1px solid rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.70);
      position:relative;
      z-index:1;
    }

    th, td{
      padding:12px 10px;
      border-bottom:1px solid rgba(0,0,0,0.06);
      text-align:center;
      font-weight:800;
    }

    th{
      background: rgba(238,242,255,0.95);
      color: var(--brand);
      font-weight:900;
    }

    tbody tr:hover{
      background: rgba(127,189,179,0.10);
    }

    .thumb{
      width:46px;
      height:46px;
      border-radius:12px;
      object-fit:cover;
      border:1px solid rgba(0,0,0,0.10);
      background:#fff;
    }

    .inline{
      display:flex;
      align-items:center;
      gap:10px;
      justify-content:center;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <h1>🧾 ניהול מוצרים</h1>
      <a href="/admin.html">⬅ חזרה ללוח מנהל</a>
    </div>

    <div class="grid">
      <div class="card">
        <h2 style="margin:0 0 10px;color:#1f2a66;">הוספה / עדכון מוצר</h2>

        <div class="row">
          <div>
            <label>קטגוריה</label>
            <select id="category" required>
              <option value="">בחרי קטגוריה</option>
              <option value="Animal">Animal</option>
              <option value="Food">Food</option>
              <option value="Vitamins and supplements">Vitamins and supplements</option>
              <option value="baby">baby</option>
              <option value="body lotion">body lotion</option>
              <option value="cleaning products">cleaning products</option>
              <option value="dental">dental</option>
              <option value="dermo cosmetics">dermo cosmetics</option>
              <option value="electronics">electronics</option>
              <option value="games">games</option>
              <option value="perfume">perfume</option>
              <option value="shampo">shampo</option>
            </select>
          </div>

          <div>
            <label>מזהה מוצר (ID)</label>
            <input id="productId" placeholder="לדוגמה: cat-scratch-01" />
          </div>

          <div>
            <label>שם מוצר</label>
            <input id="name" placeholder="שם" required />
          </div>
        </div>

        <div class="row">
          <div>
            <label>מחיר</label>
            <input id="price" type="number" step="0.01" placeholder="0.00" required />
          </div>

          <div>
            <label>תמונה</label>
            <input id="imageFile" type="file" accept="image/*" />
          </div>

          <div>
            <label>תצוגה מקדימה</label>
            <img id="preview" class="thumb" alt="" />
          </div>
        </div>

        <label>תיאור</label>
        <textarea id="description" placeholder="תיאור מוצר..."></textarea>

        <div class="btns">
          <button id="saveBtn" class="primary">💾 שמירה (הוספה/עדכון)</button>
          <button id="clearBtn" class="secondary">🧹 ניקוי</button>
          <button id="deleteBtn" class="danger">🗑️ מחיקה לפי ID</button>
        </div>

        <div id="msg" class="muted"></div>
      </div>

      <div class="card list">
        <h2 style="margin:0 0 10px;color:#1f2a66;">רשימת מוצרים (לפי קטגוריה)</h2>

        <div class="row" style="grid-template-columns:1fr 1fr;">
          <div>
            <label>קטגוריה להצגה</label>
            <select id="listCategory">
              <option value="Animal">Animal</option>
              <option value="Food">Food</option>
              <option value="Vitamins and supplements">Vitamins and supplements</option>
              <option value="baby">baby</option>
              <option value="body lotion">body lotion</option>
              <option value="cleaning products">cleaning products</option>
              <option value="dental">dental</option>
              <option value="dermo cosmetics">dermo cosmetics</option>
              <option value="electronics">electronics</option>
              <option value="games">games</option>
              <option value="perfume">perfume</option>
              <option value="shampo">shampo</option>
            </select>
          </div>
          <div>
            <label>חיפוש בשם</label>
            <input id="search" placeholder="חיפוש..." />
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>תמונה</th>
              <th>ID</th>
              <th>שם</th>
              <th>מחיר</th>
              <th>עריכה</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div id="empty" class="muted"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./admin-products.js"></script>
</body>
</html>
